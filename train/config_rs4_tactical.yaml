# Aplicar con tools.configure_rs4_rewards o prepare_rs4 --tactical-rewards.
extends: config_rs4_specialist.yaml
task_metric_versions: {rs4_4v4: 2}
rs4_tactics:
  coef: 0.12
  coef_final: 0.0
  decay_steps: 200_000_000
  start_steps: 0  # el configurador usa los pasos actuales, no este cero
  hold_styles_for_match: true
  formation_version: 2
reward:
  rs4_defensive_out_scale: 0.2  # -0.02 en lateral defensivo bajo presión; resto -0.10
  rs4_restart_approach: 0.05
  rs4_restart_stall: 0.25
  w_near_ball: 0.0
  kick_to_goal: 0.0
  w_spread: 0.0
  team_spread_floor: 0.0
