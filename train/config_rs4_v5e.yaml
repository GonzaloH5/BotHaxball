# RS4 v5e: v5d + crítico privilegiado (reloj, marcador, saques y último toque,
# SÓLO para estimar valor durante el entrenamiento; el actor y deploy no cambian).
#   python -u -m train.multitask --config train/config_rs4_v5e.yaml --run rs4_v5e \
#       --init-from runs/rs4_v5d/eval_<mejor>M.pt
extends: config_rs4_v5d.yaml
run_name: rs4_v5e
model:
  critic_features: 12
rs4_program:
  critic_warmup_steps: 10_000_000
league:
  # Anclas = sólo el campeón v3 (ver rs4_v5.protect_initial): ~20% de los
  # partidos contra el bloque que hay que aprender a romper.
  mixture: [0.50, 0.20, 0.20, 0.10]
rs4_v5:
  protect_initial: false
  league_seed: [runs/rs4_v3_public/champion.pt]
