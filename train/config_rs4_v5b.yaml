# RS4 v5b (plan B): técnica de pelota del campeón v3 + recompensa/compañeros v5
# + ancla KL al imitador humano v5 (distinto del checkpoint de arranque).
#   python -u -m train.multitask --config train/config_rs4_v5b.yaml --run rs4_v5b \
#       --init-from runs/rs4_v3_public/champion.pt
extends: config_rs4_v5.yaml
run_name: rs4_v5b
bc_reference: runs/bc_rs4_v5_attn64/bc.pt
model:
  ent_hidden: 32   # misma codificación de entidades que el campeón v3
runtime:
  separate_bc_reference: true
ppo:
  lr: 0.0002
  bc_kl_coef: 0.02
  bc_kl_final: 0.005
rs4_program:
  lr: {initial: 0.0002}
  bc: {initial: 0.02, final: 0.005}
