# Catálogo de tareas (mapa × formato × reglas) para el entrenamiento multi-tarea (train/multitask.py)
# y la matriz de evaluación (eval/matrix.py).
#
# Estadios: stadiums/<nombre>.hbs. Los de salas reales se importan con tools/import_stadium.py y se
# validan contra partidas reales con `python bridge/compare_sim.py <grabaciones>.jsonl --gate`.
#
# Mapas de LIGA (de los replays de primera división en replays_real/stadiums/<carpeta>, importados con
# tools/import_replays.py). Todos validados contra partidos reales (error de 1 tick p90 < 0.01):
#   haxarg_big   HaxArg Big            (carpeta bigx3)     sin script
#   aha_big      AHA Big v2.1          (carpeta bigx3)     sin script
#   sanguchito_x1 SANGUCHITO X1        (carpeta futsalx1)  1v1; el script sólo esconde discos y ubica jugadores
#                (saque real en ±356 fijado en "haxballrl": el mapa declara una zona de espera)
#   futsalx3     Futsal x3 Bazinga     (carpeta futsalx3)  sin script
#   af_futsalx3  AF Official 3v3       (carpeta futsalx3)  sin script
#   futsal_x4    Futsal x4 Bazinga     (carpeta futsalx4)  sin script
#   liga_x7      HAXARG LIGA X7        (carpeta futsalx7)  sin script, cancha 1200x600
#   lhl_x7       Estadio oficial LHL   (carpeta futsalx7)  sin script, cancha 1200x600
#   real_futsal_x7 Real Futsal x7      (carpeta rfx7)      con script (~3600 intervenciones/min)
#   rs_one       Real Soccer ONE       (carpeta rsx4)      con script (~230/min), cancha 1150x600
#   jjrs_x6      JJRS 6v6 v4           (carpeta rsx6)      con script (~740/min), sala pública: nivel más bajo
# Otros:
#   x6 / x6_half  Real Soccer x6 de la sala Pegeche (script completo en env/pegeche.py); x6_half es 50%
#   futsal_x1x2 (validado), futsalx7 (Bazinga), rsx4 (Real Soccer x4 GLH), big (Big oficial), classic,
#   haxeleven (validado): en el catálogo pero fuera del currículo (config_multi.yaml)
#
# Perfiles de reglas (lo que agrega el script de la sala):
#   plain: física pura del mapa, sin script
#   soccer: pelotas paradas simplificadas, SIN powershot/slide/faltas (RS normal)
#   real:  powershot con curva + pelotas paradas simplificadas (laterales/córners/saque de arco)
#   pegeche: el script completo de la sala Pegeche (env/pegeche.py): powershot + laterales, córners,
#            saques de arco, slide, faltas, tiros libres, penales y tarjetas, como en la sala real

rules:
  plain: {powershot: false, out_of_bounds: false}
  soccer: {powershot: false, out_of_bounds: true}
  real:  {powershot: true,  out_of_bounds: true}
  pegeche: {powershot: true, out_of_bounds: true, script: pegeche}

tasks:
  # --- ligas: Big y Futsal sin script
  x1_1v1:      {stadium: sanguchito_x1,  n_per_team: 1,  rules: plain}
  aha_3v3:     {stadium: aha_big,        n_per_team: 3,  rules: plain}
  big_2v2:     {stadium: haxarg_big,     n_per_team: 2,  rules: plain}
  big_3v3:     {stadium: haxarg_big,     n_per_team: 3,  rules: plain}
  big_4v4:     {stadium: haxarg_big,     n_per_team: 4,  rules: plain}
  futsal_2v2:  {stadium: futsal_x1x2,    n_per_team: 2,  rules: plain}
  futsal_3v3:  {stadium: futsalx3,       n_per_team: 3,  rules: plain}
  futsal_af_3v3: {stadium: af_futsalx3,  n_per_team: 3,  rules: plain}
  futsal_4v4:  {stadium: futsal_x4,      n_per_team: 4,  rules: plain}
  futsal_5v5:  {stadium: liga_x7,        n_per_team: 5,  rules: plain}
  futsal_7v7:  {stadium: liga_x7,        n_per_team: 7,  rules: plain}
  lhl_7v7:     {stadium: lhl_x7,         n_per_team: 7,  rules: plain}
  # --- ligas: Real Soccer y Real Futsal (con script de sala)
  rs4_3v3:     {stadium: rs_one,         n_per_team: 3,  rules: real}
  rs4_4v4: {stadium: rs_one, n_per_team: 4, rules: soccer, corner_reset_prob: 0.05, corner_execute_reward: 0.003}  jjrs_6v6:    {stadium: jjrs_x6,        n_per_team: 6,  rules: soccer}
  rf_5v5:      {stadium: real_futsal_x7, n_per_team: 5,  rules: real}
  rf_7v7:      {stadium: real_futsal_x7, n_per_team: 7,  rules: real}
  # --- sala Pegeche (script completo)
  rs_2v2:      {stadium: x6_half,        n_per_team: 2,  rules: pegeche}
  rs_3v3:      {stadium: x6_half,        n_per_team: 3,  rules: pegeche}
  rs_4v4:      {stadium: x6_half,        n_per_team: 4,  rules: pegeche}
  rs_6v6:      {stadium: x6,             n_per_team: 6,  rules: pegeche}
  # --- fuera del currículo por ahora
  classic_1v1: {stadium: classic,        n_per_team: 1,  rules: plain}
  classic_2v2: {stadium: classic,        n_per_team: 2,  rules: plain}
  futsal_1v1:  {stadium: futsal_x1x2,    n_per_team: 1,  rules: plain}
  glh_4v4:     {stadium: rsx4,           n_per_team: 4,  rules: real}
  bazinga_7v7: {stadium: futsalx7,       n_per_team: 7,  rules: plain}
  h11_11v11:   {stadium: haxeleven,      n_per_team: 11, rules: real}
