# RS4-b1, entrenamiento final (pedido del usuario, 2026-10-03, con el día de Pod que queda).
# A con plazo de saques (config_rs4_b1.yaml) y MÁS VARIEDAD de rivales y compañeros: A con plazo
# s1 ganaba +11/+22 pp contra rivales parecidos a los de entrenamiento y perdía 9-10 pp contra el R3
# agresivo, un estilo que nunca vio. Cambios respecto de A (nada más):
# * scripted con los tres estilos de R3 (antes sólo el equilibrado) y 25% de rivales scripted;
# * liga de 16 referencias de la familia de entrenamiento (v3 en varias etapas, v5, v5b, v5c);
#   siguen afuera las reservadas para evaluar (campeón, linaje v5d, BC v2 / teacher.pt);
# * 800M muestras con decisión a los 400M (evaluación en CPU cada ~100M fuera del Pod).
# El R3 agresivo deja de ser un rival nunca visto en la evaluación; el campeón y v5d siguen reservados.
#
# Ajustes tras el repaso de "por qué aprende poco" (pedido del usuario, 2026-10-03):
# * 40/20/20/20 de aprendices por equipo (antes 70/10/10/10): 27,5% de filas aprendiendo y crédito
#   menos diluido; medido en el Pod: 41,5k muestras/s contra ~30k;
# * 4608 agentes en paralelo (antes 1152): reparte el costo fijo por tick del árbitro en Python;
#   medido: ~68k muestras/s. Más hilos de física empeoraban (4: 41,5k; 8: 36k; 12: 34k);
# * entropía fija 0,004 (antes 0,002 → 0,001): en A con plazo s1 cayó 31% en 100M siguiendo ruido;
# * 35% de filas en situaciones reales (antes 20%): dan ~2× goles por segundo que un partido;
# * presupuesto 1.600M (techo 9 h), evaluación cada 200M; si a 800M no mejora, se corta.
#   python -m tools.rs4_b1_launch --freeze <id> --queue FINAL:1
extends: config_rs4_b1.yaml
run_name: rs4_b1_final
env:
  agents: 4608
ppo:
  total_steps: 1_600_000_000
runtime:
  max_wall_seconds: 32400   # 9 h
log:
  checkpoint_history_interval_seconds: 1800
  checkpoint_keep: 20
league:
  snapshot_every_steps: 50_000_000
rs4_v5:
  league_seed:
    - runs/rs4_b1/inputs/v3_2568M.pt
    - runs/rs4_v3_public/phase_A_champion.pt
    - runs/rs4_v3_public/public_source.pt
    - runs/rs4_v3_public/objective_before_v4.pt
    - runs/rs4_v3_public/control/ckpt_062374.pt
    - runs/rs4_v3_public/control/ckpt_065740.pt
    - runs/rs4_v3_public/control/ckpt_068025.pt
    - runs/rs4_v5/latest.pt
    - runs/rs4_v5b/eval_150M.pt
    - runs/rs4_v5b/latest.pt
    - runs/rs4_v5c/eval_50M.pt
    - runs/rs4_v5c/eval_150M.pt
    - runs/rs4_v5c/eval_250M.pt
    - runs/rs4_v5c/eval_300M.pt
    - runs/rs4_v5c/eval_350M.pt
    - runs/bc_rs4_v5_attn64/bc.pt
rs4_b1:
  scripted_style: -1        # los tres estilos de R3, uno por partido
  learner_weights: [0.40, 0.20, 0.20, 0.20]  # 1, 2, 3 y 4 aprendices por equipo
rs4_program:
  total_budget_steps: 1_600_000_000
  snapshot_every_steps: 50_000_000
  drills: 0.35
  opponents: {selfplay: 0.0, pool: 0.75, scripted: 0.25}
  entropy: {initial: 0.004, final: 0.004}
