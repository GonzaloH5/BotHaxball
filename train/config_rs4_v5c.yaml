# RS4 v5c: campeón v3 (técnica) + recompensa anti-empate v5, SIN ancla humana.
# v5 (desde BC) y v5b (campeón + ancla BC 0,02) perdieron técnica; ver
# reports/rs4_v5_diagnostico_20261003.md. Aquí se protege lo aprendido:
# LR bajo, entropía de v3 y 15M pasos entrenando sólo el crítico.
#   python -u -m train.multitask --config train/config_rs4_v5c.yaml --run rs4_v5c \
#       --init-from runs/rs4_v3_public/champion.pt
extends: config_rs4_v5.yaml
run_name: rs4_v5c
model:
  ent_hidden: 32   # misma codificación de entidades que el campeón v3
ppo:
  lr: 0.0001
  lr_final: 0.00008
  ent_coef: 0.002
  ent_coef_final: 0.001
  bc_kl_coef: 0.0   # sin referencia KL: no se carga ningún imitador
  bc_kl_final: 0.0
rs4_program:
  critic_warmup_steps: 15_000_000
  lr:
    initial: 0.0001
    minimum: 0.00005
    ceiling_initial: 0.00012
    ceiling_final: 0.00008
    low_kl: 0.001
    high_kl: 0.006
    epoch_stop_kl: 0.012
  entropy: {initial: 0.002, final: 0.001}
  bc: {initial: 0.0, final: 0.0}
