# Entrenamiento PPO + self-play para HaxBall.
# Uso: python -m train.ppo_selfplay --config train/config.yaml [--run nombre] [--resume]
run_name: classic_1v1
seed: 0

env:
  stadium: classic
  n_per_team: 1          # 1 = 1v1. Para 2v2/3v3 usar otro run (el tamaño de la obs cambia)
  n_envs: 512
  frame_skip: 3          # el agente decide cada 3 ticks (20 decisiones/s)
  max_ticks: 7200        # 2 minutos de juego por episodio como máximo (termina antes si hay gol)
  random_reset_prob: 0.3 # 30% de los episodios arrancan en posiciones aleatorias, 70% con saque
  kickoff_timeout: 180   # 3 s para sacar; si no, penalidad y se reinicia (evita trabar el partido)
  action_delay_max: 0    # lag simulado: cada partido sortea 0..N ticks de retraso de acción.
                         # Para salas ajenas (--join) usar 3 en un fine-tune: el bot ya extrapola por el
                         # retraso medido (~8 ticks como cliente), esto cubre el jitter restante.

model:
  hidden: 256
  layers: 2

ppo:
  total_steps: 2_000_000_000   # decisiones de agentes; cortar cuando quieras (Ctrl+C guarda)
  rollout_len: 128
  epochs: 3
  minibatch: 4096
  lr: 5.0e-4
  lr_final: 5.0e-5
  gamma: 0.995
  gae_lambda: 0.95
  clip: 0.2
  ent_coef: 0.01
  ent_coef_final: 0.002
  vf_coef: 0.5
  max_grad_norm: 0.5
  torch_threads: 8

reward:
  goal: 1.0
  w_ball_progress: 1.0
  w_near_ball: 0.5
  kick_to_goal: 0.02
  kickoff_stall: 1.0      # igual que un gol en contra
  kickoff_approach: 1.0   # premio por acercarse a la pelota en el saque propio (llegar ~ +1)
  shaping_decay_steps: 300_000_000   # el shaping baja linealmente a 0 en estos pasos

# Currículo: fracción de partidos por tipo de rival.
# Se avanza de etapa cuando el winrate (por goles) contra el bot scripteado supera `advance_winrate`.
curriculum:
  - name: vs_scripted
    scripted: 0.7
    selfplay: 0.3
    pool: 0.0
    scripted_eps: 0.5      # el bot hace 50% de acciones al azar (fácil)
    advance_winrate: 0.8
  - name: vs_scripted_hard
    scripted: 0.4
    selfplay: 0.4
    pool: 0.2
    scripted_eps: 0.1
    advance_winrate: 0.85
  - name: league
    scripted: 0.05
    selfplay: 0.45
    pool: 0.5
    scripted_eps: 0.0
    advance_winrate: 2.0   # última etapa

league:
  snapshot_every: 25       # iteraciones
  max_size: 50
  opponents_per_iter: 4
  pfsp_power: 2.0

log:
  every: 5
  checkpoint_every: 25
