# Entrenamiento multi-tarea: un solo modelo para muchos mapas y formatos (train/multitask.py).
# Uso: python -m train.multitask --config train/config_multi.yaml [--run nombre] [--resume]
run_name: multi
seed: 0
tasks_file: train/tasks.yaml
# Las marcas históricas de RS4 con powershot no son comparables con RS normal.
task_metric_versions: {rs4_4v4: 1}

env:
  agents: 1152            # agentes simultáneos en total (se reparten entre tareas según su peso)
  frame_skip: 3
  max_ticks: 7200
  random_reset_prob: 0.3
  kickoff_timeout: 180
  action_delay_max: 0

model:
  hidden: 256
  layers: 2
  ent_hidden: 32          # encoder de entidades liviano: medido en esta CPU, 2.3x más rápido que 64x2
  ent_layers: 1
  pooling: meanmax        # "attention" suma una capa de atención (para equipos grandes)

ppo:
  total_steps: 3_000_000_000
  rollout_len: 128
  epochs: 3
  minibatch: 8192
  lr: 5.0e-4
  lr_final: 5.0e-5
  gamma: 0.995
  gae_lambda: 0.95
  clip: 0.2
  ent_coef: 0.01
  ent_coef_final: 0.002
  vf_coef: 0.5
  max_grad_norm: 0.5
  torch_threads: 8        # medido: 8 es lo más rápido en esta PC
  device: cpu
  # Regularización hacia el modelo de imitación (sólo si se arranca con --init-from runs/bc/bc.pt):
  # KL(pi_humano || pi) con este peso, que baja linealmente hasta bc_kl_final. Mantiene el estilo humano
  # (posiciones, esperar el saque) mientras el RL mejora el nivel.
  bc_kl_coef: 0.03        # el imitador todavía es débil (pierde con el bot): que guíe el estilo sin frenar al RL
  bc_kl_final: 0.003

reward:
  goal: 1.0
  w_ball_progress: 1.0
  w_near_ball: 0.5
  kick_to_goal: 0.02
  out_penalty: 0.1
  w_spread: 0.3
  kickoff_stall: 1.0
  kickoff_approach: 1.0
  shaping_decay_steps: 400_000_000

# Currículo por AMPLITUD con repaso. Cada etapa suma tareas; las de etapas anteriores siguen con
# `rehearsal_weight` (relativo a 1 de las nuevas) y nunca bajan de `min_share` de las muestras.
# Se pasa de etapa cuando todas las tareas activas llegaron a la liga y se cumplió min_steps (o max_steps).
stages:
  - name: A_basico_mapas_distintos
    tasks: [big_2v2, big_3v3, futsal_2v2, futsal_3v3, x1_1v1, aha_3v3]   # sin Classic (no hay recs de liga)
    min_steps: 60_000_000
    max_steps: 250_000_000
  - name: B_equipos_chicos_y_reales
    tasks: [big_4v4, futsal_4v4, rs4_4v4, jjrs_6v6]
    min_steps: 150_000_000
    max_steps: 600_000_000
  - name: C_equipos_medianos
    tasks: [futsal_5v5, futsal_7v7, lhl_7v7, rf_5v5, rf_7v7]
    min_steps: 200_000_000
    max_steps: 800_000_000
  # D_haxeleven (h11_11v11) queda fuera por ahora: con 21 entidades el update es ~4x más caro en CPU.
  # Para sumarlo: agregar una etapa con tasks: [h11_11v11] (la tarea ya está en train/tasks.yaml).

schedule:
  rehearsal_weight: 0.5
  min_share: 0.04
  rebalance_every: 25       # iteraciones entre chequeos de regresión / avance de etapa
  min_goals: 200            # goles vs bot que se miden (ventana por goles) para avanzar de rival / regresiones
  regression_drop: 0.15     # caída del winrate vs bot respecto de la mejor marca que dispara más peso
  regression_boost: 1.5

# Currículo de rivales (por tarea): se avanza con el winrate por goles contra el bot scripteado.
curriculum:
  - {name: vs_scripted,      scripted: 0.7,  selfplay: 0.3,  pool: 0.0, scripted_eps: 0.5, advance_winrate: 0.8}
  - {name: vs_scripted_hard, scripted: 0.4,  selfplay: 0.4,  pool: 0.2, scripted_eps: 0.1, advance_winrate: 0.85}
  - {name: league,           scripted: 0.05, selfplay: 0.45, pool: 0.5, scripted_eps: 0.0, advance_winrate: 2.0}

league:
  snapshot_every: 25
  max_size: 60
  opponents_per_iter: 4
  pfsp_power: 2.0

log:
  every: 5
  checkpoint_every: 25
  replay_every: 100         # cada 100 iteraciones (~30-40 min) graba un replay en runs/<run>/replays/
  replay_minutes: 2.0       # (proceso aparte; rota tareas y alterna rival: bot / sí mismo)
