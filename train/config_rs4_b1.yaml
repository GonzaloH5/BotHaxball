# RS4-b1, candidato A (PLAN_RS4.md sección 3): la mejor política existente reevaluada
# (v3 2568M, 0,412 puntos con el protocolo RS4-b1) con el entorno, el objetivo y los
# compañeros corregidos. B y C extienden este archivo y sólo cambian arquitectura e
# inicialización: los hiperparámetros son comunes.
#
# Lanzar SIEMPRE con el lanzador (verifica la congelación de código y escribe el manifiesto):
#   python -m tools.rs4_b1_launch --candidate A --seed 1
#
# Condiciones comunes:
# * árbitro real rs_one_v1 (contrato reports/rs4_b1/contract.json), partidos de 3 min como la evaluación;
# * recompensa: sólo goles ±1. Sin guía, sin potenciales, sin premios de pases/posesión y sin
#   multas anti-0-0. Se conserva el límite de seguridad del saque inicial (la sala no lo vence;
#   sin él, trabarlo sería un terminal gratis). Los saques no vencen (árbitro real);
# * 20% de las filas en situaciones técnicas con estados reales de la partición de entrenamiento;
# * composición 70% un aprendiz + 3 compañeros congelados, 20% dos o tres aprendices, 10% cuatro;
# * compañeros y rivales de ENTRENAMIENTO (rs4_v5.league_seed + scripted estilo 0). La familia de
#   evaluación (campeón, linaje v5d, BC v2, scripted estilos 1 y 2) no se usa para entrenar;
# * crítico privilegiado (reloj, marcador, saques, último toque) sólo para el valor;
# * calentamiento del crítico 10M muestras con actor y encoder congelados; optimizador nuevo;
# * presupuesto: 100M muestras de aprendizaje (filas que entran a PPO), techo de 1,5 h.
extends: config_rs4_v5.yaml
run_name: rs4_b1_a
seed: 1
env:
  referee: rs_one_v1
  max_ticks: 10800
model:
  type: set
  hidden: 256
  layers: 2
  ent_hidden: 32
  ent_layers: 1
  pooling: meanmax          # misma arquitectura que v3 2568M
  rule_observation: masked
  public_signals_version: 1
  critic_features: 12
ppo:
  total_steps: 100_000_000
  lr: 0.0001
  lr_final: 0.00008
  ent_coef: 0.002
  ent_coef_final: 0.001
  bc_kl_coef: 0.0           # sin ancla KL al BC (memoria rs4-v5-pivot)
  bc_kl_final: 0.0
reward:
  goal: 1.0
  out_penalty: 0.0          # la salida ya cuesta la posesión en el juego; no es una regla de la sala
  kickoff_stall: 0.25       # límite de seguridad del saque inicial (desvío documentado del contrato)
  kickoff_approach: 0.0
  # Saque no ejecutado en rs4_b1.restart_deadline_ticks: configure_rs4_v3 fija la multa en 0,25.
  rs4_restart_stall: 0.25
  rs4_restart_approach: 0.0
  team_spread_floor: 0.0
  team_pass_success: 0.0
  team_pass_value: 0.0
  team_pass_chain: 0.0
  team_pass_possession_cap: 0.0
league:
  max_size: 24
  match_pfsp: true
  # anclas (familia de entrenamiento) / intermedios / recientes / uniforme
  mixture: [0.40, 0.20, 0.30, 0.10]
  snapshot_every_steps: 25_000_000
runtime:
  max_wall_seconds: 5400
rs4_v5:
  add_initial: false        # misma liga para A, B y C: sólo la familia de entrenamiento
  league_seed:
    - runs/rs4_b1/inputs/v3_2568M.pt         # copia fija de rs4_v3_public/control/latest.pt
    - runs/rs4_v3_public/phase_A_champion.pt
    - runs/rs4_v5c/eval_150M.pt
    - runs/rs4_v5c/eval_300M.pt
    - runs/rs4_v5b/eval_150M.pt
    - runs/bc_rs4_v5_attn64/bc.pt            # imitador humano pasivo (no el único compañero)
rs4_b1:
  # Punto de partida (lo pasa el lanzador como --init-from y verifica el hash): v3 2568M,
  # el mejor del protocolo RS4-b1 y referencia de las compuertas.
  init_from: runs/rs4_b1/inputs/v3_2568M.pt
  init_sha256: f9ce8b4e7d8b5af5c6519633dad5dbfbd87290602a2e2bb29af7530e86c53697
  learner_weights: [0.70, 0.10, 0.10, 0.10]  # 1, 2, 3 y 4 aprendices por equipo
  scripted_style: 0                          # equilibrado; 1 y 2 quedan reservados para evaluación
  pass_participant_credit: 0.0
  # Plazo de entrenamiento para ejecutar laterales, córners y saques de arco (10 s, >= p99 humano;
  # la ventana de la batería de evaluación). Sin él, A1 dejaba vencer el 64% de los córners: la
  # liberación de seguridad del árbitro (900 ticks) era gratis. Multa 0,25 y el juego sigue.
  restart_deadline_ticks: 600
  recorded:
    path: data/rs4_states/entrenamiento.npz
    ticks: 720                               # 12 s
    mix: {attack: 0.4, open: 0.3, restart: 0.3}
rs4_program:
  version: 5
  start_steps: 0
  total_budget_steps: 100_000_000
  evaluation_every_steps: 1_000_000_000      # la evaluación corre fuera del Pod (eval/rs4_b1.py)
  snapshot_every_steps: 25_000_000
  critic_warmup_steps: 10_000_000
  drills: 0.20
  # load_config fusiona diccionarios: los ejercicios sintéticos de v5 se anulan explícitamente.
  drill_weights: {corner: 0.0, lateral: 0.0, goal_kick: 0.0, recorded: 1.0}
  opponents: {selfplay: 0.0, pool: 0.85, scripted: 0.15}
  frozen_teammates: 0.0                      # sin uso: la composición la fija rs4_b1.learner_weights
  reward:
    ball_progress: 0.0
    near_ball: 0.0
    spread: 0.0
    pass_possession_cap: 0.0
    possession_change: 0.0
    no_goal_penalty: 0.0
    no_goal_step_penalty: 0.0
    restart_potential: 0.0
    restart_bonus: 0.0
    gamma: 0.995
  lr:
    initial: 0.0001
    minimum: 0.00005
    ceiling_initial: 0.00012
    ceiling_final: 0.00008
    low_kl: 0.001
    high_kl: 0.006
    epoch_stop_kl: 0.012
    every_iterations: 10
    increase: 1.15
    decrease: 0.75
  entropy: {initial: 0.002, final: 0.001}
  bc: {initial: 0.0, final: 0.0}
