# RS4 v5: arranque desde imitación humana, recompensa anti-bloque y self-play real.
# Diagnóstico y razones: reports/rs4_v5_diagnostico_20261003.md
#
# Arranque (Pod), con el BC elegido:
#   python -u -m train.multitask --config train/config_rs4_v5.yaml --run rs4_v5 \
#       --init-from runs/bc_rs4_v5_attn64/bc.pt
# Reanudar:
#   python -u -m train.multitask --config train/config_rs4_v5.yaml --run rs4_v5 --resume
extends: config_rs4_specialist.yaml
run_name: rs4_v5
seed: 5
task_metric_versions: {rs4_4v4: 3}
env:
  agents: 1152
  frame_skip: 3
  max_ticks: 7200
  random_reset_prob: 0.0
  kickoff_timeout: 180
  action_delay_max: 0
model:
  type: set
  hidden: 256
  layers: 2
  ent_hidden: 64
  ent_layers: 1
  pooling: attentive_meanmax
  rule_observation: masked
  public_signals_version: 1
ppo:
  device: cuda
  torch_threads: 2
  numba_threads: 4
  total_steps: 3_000_000_000
  rollout_len: 128
  minibatch: 8192
  epochs: 4
  gamma: 0.995
  gae_lambda: 0.95
  clip: 0.2
  vf_coef: 0.5
  max_grad_norm: 0.5
  # lr/ent/bc reales los fija rs4_program (calendario v5); estos valores sólo
  # habilitan la carga de la referencia BC (bc_kl_coef > 0).
  lr: 0.0003
  lr_final: 0.0001
  ent_coef: 0.005
  ent_coef_final: 0.003
  bc_kl_coef: 0.05
  bc_kl_final: 0.01
  sequence_length: 32
reward:
  goal: 1.0
  out_penalty: 0.1
  rs4_defensive_out_scale: 0.2
  kickoff_stall: 0.25
  kickoff_approach: 0.0
  rs4_restart_stall: 0.25
  rs4_restart_approach: 0.011
  team_spread_floor: 0.0
league:
  max_size: 24
  match_pfsp: true
  # protegidos / intermedios (~50% contra nosotros) / recientes / uniforme
  mixture: [0.20, 0.30, 0.40, 0.10]
  opponents_per_iter: 4
  pfsp_power: 2.0
  snapshot_every_steps: 25_000_000
runtime:
  freeze_normalizers: true
  optimize_rollout: true
  preserve_bc_reference: true
  cuda_decisions: auto
  rs4_v3: true
log:
  every: 25
  checkpoint_interval_seconds: 300
  checkpoint_history_interval_seconds: 1800
  checkpoint_keep: 8
  replay_every: 0
public_signals:
  version: 1
  barrier_discs: []
  barrier_segments: []
  auto_joints: true
  joint_profile: rs4_paired_lateral_v1
  red_colors: [16711680, 15035990, 15496280, 16727860]
  blue_colors: [255, 5671397, 4767481, 1031417]
rs4_v3:
  pause_for_evaluation: false
rs4_v5:
  # Rivales protegidos además del BC inicial. En el Pod: el campeón v3 (bloque
  # defensivo) obliga a aprender a romperlo.
  league_seed: []
rs4_program:
  version: 5
  start_steps: 0
  total_budget_steps: 3_000_000_000
  evaluation_every_steps: 200_000_000
  snapshot_every_steps: 25_000_000
  drills: 0.10
  drill_weights: {corner: 0.4, lateral: 0.3, goal_kick: 0.3}
  opponents: {selfplay: 0.50, pool: 0.40, scripted: 0.10}
  frozen_teammates: 0.10
  reward:
    ball_progress: 0.10
    near_ball: 0.02
    spread: 0.05
    pass_possession_cap: 0.05
    possession_change: 0.01
    no_goal_penalty: 0.30
    restart_potential: 0.011
    restart_bonus: 0.02
    gamma: 0.995
  lr:
    initial: 0.0003
    minimum: 0.00005
    ceiling_initial: 0.0004
    ceiling_final: 0.00015
    low_kl: 0.003
    high_kl: 0.008
    epoch_stop_kl: 0.015
    every_iterations: 10
    increase: 1.15
    decrease: 0.75
  entropy: {initial: 0.005, final: 0.003}
  bc: {initial: 0.05, final: 0.01}
