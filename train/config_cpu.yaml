# Pod CPU i5-10400F: física 4 medida a 6.876 pasos/s reales (Torch 8).
# Hereda íntegros PPO, referencia BC, recompensas, liga y currículo de RunPod.
extends: config_runpod.yaml
ppo:
  device: cpu
  torch_threads: 8
  numba_threads: 4
runtime:
  optimize_cpu: true     # rivales/bootstrap agrupados y buffer de minibatch
  cuda_decisions: legacy
  reuse_ppo_batch: false
  cache_bc_logits_cpu: true  # una inferencia BC por muestra/lote, reutilizada en épocas PPO
