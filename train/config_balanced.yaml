# Perfil actual: mismo presupuesto de agentes para cada escenario de la etapa A.
# Mantiene checkpoint, PPO, liga y shaping al reanudar; sólo fija el reparto.
extends: config_runpod.yaml
stages:
  - name: A_equilibrada
    tasks: [big_3v3, futsal_2v2, futsal_3v3, futsal_af_3v3, x1_1v1, aha_3v3]
    fixed_weights: true
    weights:
      big_3v3: 1.0
      futsal_2v2: 1.0
      futsal_3v3: 1.0
      futsal_af_3v3: 1.0
      x1_1v1: 1.0
      aha_3v3: 1.0
