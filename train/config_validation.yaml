# Run separado: una sola modalidad; nunca amplía el currículo automáticamente.
run_name: futsal_validation
seed: 0
tasks_file: train/tasks.yaml
env:
  agents: 192
  frame_skip: 3
  max_ticks: 7200
  random_reset_prob: 0.3
  kickoff_timeout: 180
  action_delay_max: 3
model:
  hidden: 256
  layers: 2
  ent_hidden: 32
  ent_layers: 1
  pooling: meanmax
  rule_observation: masked
ppo:
  total_steps: 60000000
  rollout_len: 128
  epochs: 3
  minibatch: 4096
  lr: 0.0005
  lr_final: 5.0e-05
  gamma: 0.995
  gae_lambda: 0.95
  clip: 0.2
  ent_coef: 0.01
  ent_coef_final: 0.002
  vf_coef: 0.5
  max_grad_norm: 0.5
  torch_threads: 2
  device: cpu
  bc_kl_coef: 0.1
  bc_kl_final: 0.01
reward:
  goal: 1.0
  w_ball_progress: 1.0
  w_near_ball: 0.5
  kick_to_goal: 0.02
  out_penalty: 0.1
  w_spread: 0.3
  kickoff_stall: 1.0
  kickoff_approach: 1.0
  shaping_decay_steps: 40000000
stages:
- name: validate_futsal_3v3
  tasks:
  - futsal_3v3
schedule:
  rehearsal_weight: 0.5
  min_share: 0.04
  rebalance_every: 25
  regression_drop: 0.15
  regression_boost: 1.5
curriculum:
- name: vs_scripted
  scripted: 0.7
  selfplay: 0.3
  pool: 0.0
  scripted_eps: 0.5
  advance_winrate: 0.8
- name: vs_scripted_hard
  scripted: 0.4
  selfplay: 0.4
  pool: 0.2
  scripted_eps: 0.1
  advance_winrate: 0.85
- name: league
  scripted: 0.05
  selfplay: 0.45
  pool: 0.5
  scripted_eps: 0.0
  advance_winrate: 2.0
league:
  snapshot_every: 25
  max_size: 60
  opponents_per_iter: 4
  pfsp_power: 2.0
log:
  every: 5
  checkpoint_every: 25
