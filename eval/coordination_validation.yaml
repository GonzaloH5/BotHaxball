# Protocolo de aceptación. Cada celda usa 64 partidos de tres minutos,
# 32 con el candidato rojo y 32 azul.
games: 64
minutes: 3
seed: 19001
greedy: false
r2_tasks: [futsal_1v1, futsal_2v2, big_3v3, futsal_3v3, futsal_4v4, futsal_5v5, futsal_7v7]
r3_tasks: [big_3v3, futsal_3v3, futsal_af_3v3, aha_3v3, rs4_4v4]
r3_styles: [0, 1, 2]
historical_tasks: [big_3v3, futsal_3v3, rs4_4v4]
restart_task: rs4_4v4
restart_trials: 8
human_metrics: reports/human_coordination_validation.json
human_metric_aliases: {aha_3v3: big_3v3}
gates:
  max_core_r2_drop: 0.03
  max_retention_r2_drop: 0.05
  min_r3_points: 0.65
  max_rs4_scoreless: 0.25
  progressive_multiplier: 1.5
  max_turnover_increase_per_minute: 0.0
  min_restart_useful: 0.90
  min_corner_useful: 0.90
  max_restart_timeout: 0.01

