# Protocolo fijo: 64 partidos por rival, mitad de cada color, 3 minutos.
# No editar entre candidatos; cambiarlo crea un protocolo distinto.
tasks: [futsal_3v3]
games_per_seed: 16
seeds: [7, 101, 503, 997]
minutes: 3
greedy: false
action_delay_max: 3
gates:
  min_games: 64
  min_points_vs_scripted: 0.60
  min_points_vs_reference: 0.50
  max_scoreless_fraction: 0.25
  max_point_drop: 0.10
